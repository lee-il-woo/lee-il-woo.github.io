<style>
  :root {
    --ink: #1a1a1a;
    --dim: #5c5c5c;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8e8e8;
      --dim: #a0a0a0;
      --rule: #333333;
      --bg: #141414;
    }
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    max-width: 34rem;
    margin: 0 auto;

  }
  h1 { font-size: 1.75rem; margin: 0 0 2.5rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
  .game {
    padding: 1.25rem 0;
    border-top: 1px solid var(--rule);
  }
  .game p { margin: 0; color: var(--dim); font-size: 0.95rem; }
  .game a { color: inherit; }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--dim);
    font-size: 0.9rem;
  }
  footer a { color: inherit; }
